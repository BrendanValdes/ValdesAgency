<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Valdes Agency</title>
<meta name="description" content="Marketing systems for service businesses. Las Vegas. Strategy calls by appointment.">
<meta property="og:title" content="Valdes Agency">
<meta property="og:description" content="Marketing systems for service businesses. Las Vegas. Strategy calls by appointment.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://valdesagency.com">
<meta property="og:site_name" content="Valdes Agency">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Valdes Agency">
<meta name="twitter:description" content="Marketing systems for service businesses. Las Vegas.">
<meta name="theme-color" content="#0A0A0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap">
<style>
:root{
  --ink:#0A0A0A;
  --paper:#FFFFFF;
  --signal:#B91C1C;
  --signal-deep:#7A0E0E;
  --power:#E85D04;
  --paper-dim:#9B9B9B;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink)}
body{
  color:var(--paper);
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;
  font-weight:400;
  line-height:1.4;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  display:flex;
  flex-direction:column;
  min-height:100vh;
  padding:clamp(24px,5vw,64px);
  overflow-x:hidden;
  position:relative;
}
body::before{
  content:"";
  position:fixed;
  top:50%;
  right:-15vw;
  width:70vw;
  height:70vw;
  max-width:1000px;
  max-height:1000px;
  background:radial-gradient(circle at center,var(--signal) 0%,transparent 60%);
  opacity:.32;
  filter:blur(90px);
  transform:translateY(-50%);
  pointer-events:none;
  z-index:0;
}
.frame{
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  flex:1;
  position:relative;
  z-index:1;
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--paper-dim);
  font-weight:500;
}
.center{
  display:flex;
  flex-direction:column;
  justify-content:center;
  flex:1;
  padding:clamp(40px,8vh,140px) 0;
  max-width:1100px;
}
.wordmark{
  font-weight:800;
  font-size:clamp(56px,13vw,200px);
  line-height:.88;
  letter-spacing:-.045em;
  text-transform:uppercase;
}
.wordmark span{display:block}
.wordmark em{color:var(--signal);font-style:normal}
.positioning{
  margin-top:clamp(28px,4vh,48px);
  font-size:clamp(20px,2.4vw,30px);
  font-weight:400;
  line-height:1.3;
  max-width:760px;
  color:var(--paper);
  letter-spacing:-.005em;
}
.bottom{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  flex-wrap:wrap;
  gap:32px;
  font-size:15px;
  letter-spacing:.02em;
}
.contact{display:flex;flex-direction:column;gap:6px}
.contact a{
  color:var(--paper);
  text-decoration:none;
  transition:color .2s ease;
  display:inline-block;
}
.contact a:hover{color:var(--signal)}
.appointment{
  color:var(--paper-dim);
  text-transform:uppercase;
  letter-spacing:.16em;
  font-size:11px;
  font-weight:500;
}
.dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--power);
  margin-right:12px;
  vertical-align:middle;
  box-shadow:0 0 14px var(--power),0 0 28px rgba(232,93,4,.4);
}
@media (max-width:640px){
  .bottom{flex-direction:column;align-items:flex-start;gap:20px}
  .top{font-size:11px;letter-spacing:.12em}
}
</style>
</head>
<body>
<div class="frame">
  <header class="top">
    <span>Las Vegas</span>
    <span>MMXXVI</span>
  </header>
  <main class="center">
    <h1 class="wordmark">
      <span>Valdes</span>
      <span>Agency<em>.</em></span>
    </h1>
    <p class="positioning">Marketing systems for service businesses.</p>
  </main>
  <footer class="bottom">
    <div class="contact">
      <a href="mailto:hello@valdesagency.com">hello@valdesagency.com</a>
      <a href="tel:+17025238826">702.523.8826</a>
    </div>
    <div class="appointment"><span class="dot"></span>Strategy calls by appointment</div>
  </footer>
</div>
</body>
</html>
