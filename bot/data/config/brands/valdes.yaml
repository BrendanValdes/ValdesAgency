# Valdes Agency — Brand Config v1
# Active brand. v1 of the Content System runs exclusively on this config.
# Schema reference: config/brands/_schema.yaml
# Loader: bot/src/services/brand-config.ts

schema_version: "1.0"
brand_key: "valdes"
display_name: "Valdes Agency"
status: active
default_brand: true

# ============================================================
# POSITIONING
# ============================================================

positioning:
  one_liner: "Marketing expert running an agency for Vegas service businesses."
  voice_anchors:
    - path: "skills/sales.md"
      weight: 0.25
    - path: "skills/email-sequences.md"
      weight: 0.15
    - path: "memory/leads/vegas-pool-scripts-v2.md"
      weight: 0.15
    - path: "memory/voice/valdes-tone-samples.md"  # PENDING Brendan upload — blocks generation
      weight: 0.45

# ============================================================
# VOICE
# ============================================================

voice:
  banned_words:
    - { term: "leverage" }
    - { term: "unlock" }
    - { term: "dive in" }
    - { term: "deep-dive" }
    - { term: "deep dive" }
    - { term: "game-changer" }
    - { term: "game changer" }
    - { term: "level up" }
    - { term: "hustle" }
    - { term: "grind", pos: "verb" }
    - { term: "journey" }
    - { term: "mindset" }
    - { term: "value-add" }
    - { term: "value add" }
    - { term: "synergy" }
    - { term: "ecosystem" }
    - { term: "robust" }
    - { term: "seamless" }
    - { term: "cutting-edge" }
    - { term: "cutting edge" }
    - { term: "paradigm" }
    - { term: "ROI", context_exception: "paid ads" }
    - { term: "pivot" }
    - { term: "scale", pos: "verb" }
    - { term: "10x" }
    - { term: "north star" }
    - { term: "double-click" }
    - { term: "double click" }
    - { term: "circle back" }
    - { term: "master" }
    - { term: "optimize" }    # use "fix" or "improve"
    - { term: "revolutionize" }
    - { term: "transform" }
    - { term: "empower" }
    - { term: "elevate" }
    - { term: "curate" }
    - { term: "craft", pos: "verb" }
    - { term: "foster" }
    - { term: "drive", pos: "verb" }   # verb meaning "cause"

  banned_structures:
    - pattern_id: "most_people_think"
      # Generalized 2026-06-11: original regex only caught the literal example
      # ("most people think ... but really"). "Most pool owners think X. It
      # doesn't Y." sailed through in the first real batch. Now matches the
      # STRUCTURE: most/everyone + [group] + think/believe/assume claim,
      # followed by a contradiction pivot sentence.
      description: 'Format: "Most [group] think/believe/assume X. [contradiction] Y."'
      regex: "\\b(?:most\\s+(?:\\w+\\s+){0,3}|every(?:one|body)\\s+)(?:thinks?|believes?|assumes?)\\b[^.!?\\n]{0,140}[.!?]\\s+(?:but\\b|really\\b|actually\\b|in reality\\b|the (?:truth|reality)\\b|that'?s not\\b|it'?s not\\b|it (?:doesn'?t|isn'?t|won'?t|never)\\b|they'?re wrong\\b|wrong\\b)"
    - pattern_id: "heres_the_thing"
      description: "Opener: 'Here''s the thing.'"
      regex: "\\bhere'?s the thing\\b"
    - pattern_id: "three_things_list"
      description: 'Format: "Three things I learned..."'
      regex: "\\b(three|3) things (i|we) learned\\b"
    - pattern_id: "in_todays_world"
      description: "Opener: 'In today''s [adjective] world...'"
      regex: "in today'?s \\w+ world"
    - pattern_id: "stop_doing_start_doing"
      description: 'Format: "Stop doing X. Start doing Y."'
      regex: "stop doing .+\\.\\s+start doing"
    - pattern_id: "its_not_its"
      description: "Format: 'It''s not X. It''s Y.' overused contrast"
      regex: "it'?s not [^\\.]+\\.\\s+it'?s "
    - pattern_id: "closing_takeaway"
      description: 'Closing summary: "The takeaway is..." / "Bottom line..."'
      regex: "(the takeaway is|bottom line[,:])"

  banned_scenarios:
    # Added Gate 3.1 (2026-05-22). Scenario 12 (first close milestone) permanent ban.
    # Source of truth for the spec: memory/voice/valdes-tone-samples.md Scenario 12.
    - scenario_id: "first_milestone"
      description: "Auto-generated first-client/first-close milestone framing per Scenario 12 ban"
      regex_patterns:
        - "\\b(my )?first (client|customer|deal|close|sale|signed?)\\b"
        - "\\bsigned (my|our) first\\b"
        - "\\b(today is the day|this is the moment|big news)\\b"
        - "\\bI('m| am) (officially|finally|legally) (an?|the) (agency owner|entrepreneur|founder)\\b"
        - "\\b\\d+ (months?|weeks?|days?) in[,.]\\s+(zero|0|no) clients?\\b"
        - "\\bstarted (the|my) agency\\b.{0,80}\\b(zero|nothing|0|no clients?)\\b"
        - "\\b(milestone|breakthrough|first ever) (day|moment|deal|sale)\\b"
      keyword_triggers:
        - "first client"
        - "first close"
        - "first deal"
        - "first sale"
        - "first signed"
        - "agency milestone"
        - "breakthrough day"
        - "ground-breaking day"
        - "from zero to"
        - "made it official"
      structural_checks:
        - "past_recap_present_win"
        - "before_state_after_state_self_referential"
      permanent: true
      rationale: "Expert from the jump per user direction. Client wins go via Scenario 3 work-specifics framing once unlocked."

  max_sentence_words: 20
  # reading_level_max removed (Gate 1 Fix 2). Voice quality enforced by
  # max_sentence_words + banned_words + banned_structures + manual review.
  # Field is optional in schema; SVFY/TNT can opt in later if desired.
  # Note: opening_rhetorical_question regex removed (Gate 1 Fix 4). Regex
  # can't reliably distinguish rhetorical from genuine question hooks.
  # Question-opening posts get manually reviewed during approval flow.
  required_per_post:
    - "1+ specific concrete reference (named industry, named neighborhood, dollar amount, percentage, or specific business type)"
  dash_policy: none

# ============================================================
# VISUAL IDENTITY
# ============================================================

visual:
  palette:
    primary: "#FFFFFF"
    secondary: "#C8A653"      # muted warm gold — expert, not flashy
    accent: "#7A1F2E"         # deep institutional maroon — authority
    neutral_dark: "#1A1A1A"
    neutral_soft: "#F5F2EB"
  fonts:
    display: "Fraunces"       # Google Fonts, free, 700-900 weight
    body: "Inter"             # Google Fonts, free, 400/500 weight
    accent: "Syne"            # Google Fonts, free, 600-700 weight (continuity with Desert Blue demo)
  logo:
    main: "memory/brand/valdes/logo.svg"               # PENDING Brendan upload
    watermark: "memory/brand/valdes/logo-watermark.png" # PENDING Brendan upload
    watermark_position: "bottom-right"
    watermark_opacity: 0.6

# ============================================================
# CADENCE
# ============================================================

cadence:
  posts_per_platform_per_day: 3
  platforms:
    - "linkedin"
    - "instagram"
    - "facebook"
    - "x"
    # tiktok deferred to v1.1 — Publer Business signup required first
  exploration_ratio: 0.33     # 1 of 3 daily posts is a new-angle test
  # Gate 6 cycle length: 1 = plan one week per cycle, 2 = two weeks.
  # Flipping this is a config change, not a rebuild.
  cycle_weeks: 1
  # Posting slots, LA wall-clock. Only platforms listed here get
  # auto-posting. IG/FB enable at Gate 6 Phase D (after a supervised live
  # test post per platform) — do NOT add them before that test passes.
  slot_times:
    linkedin: ["09:00", "13:00"]   # weekly cycle uses 09:00; 13:00 stays for ad-hoc /content
  weekly_pattern:
    monday: "framework"
    tuesday: "tip_or_observation"
    wednesday: "tip_or_observation"
    thursday: "tip_or_observation"
    friday: "weekly_roundup"
    saturday: "lighter_or_grind"
    sunday: "no_originals"

# ============================================================
# APPROVAL FLOW
# ============================================================

approval:
  channel_env_var: "CHANNEL_CONTENT_VALDES"   # env var NAME, NEVER the literal channel ID
  # Gate 6: "weekly" runs the week cycle from weekly_plan_time and disables
  # the Gate 5 daily auto-batch. /content stays available for ad-hoc batches.
  mode: "weekly"
  weekly_plan_time: "0 20 * * 0 America/Los_Angeles"      # Sun 8pm Vegas time
  daily_preview_time: "0 7 * * * America/Los_Angeles"     # 7am Vegas time
  daily_publish_pass_time: "0 9 * * * America/Los_Angeles" # 9am Vegas time
  approval_lapse_hours: 48    # Gate 5 per-draft lapse; Gate 6 uses 72h per-phase deadlines

# ============================================================
# ACCOUNTS (Composio connections — set during Phase 0)
# ============================================================

accounts:
  # Linked 2026-06-12 via auth configs linkedin-valdes (ac_7988zT5xMQaj),
  # instagram-valdes (ac_AzGt_SQF8NYF), facebook-valdes (ac_OZ1cgiHqjSCz).
  # These ca_ IDs are the CONNECTED ACCOUNTS under those configs — the bot
  # needs ca_, never ac_. ONLY linkedin is an enabled posting channel:
  # cadence.slot_times is the posting gate and lists linkedin alone. The
  # scheduler never assigns slots to platforms absent from slot_times.
  linkedin:
    composio_connection_id: "ca_Lwl0iJyzVVJ4"
    handle: "@valdesagency"
  instagram:
    # DISABLED until image pipeline exists. Do NOT add to slot_times.
    composio_connection_id: "ca_reSC5_QzcHOR"
    handle: "@valdesagency"
  facebook:
    # DISABLED until image pipeline exists. Do NOT add to slot_times.
    composio_connection_id: "ca_GgY0k9ZKdsgf"
    page_id: "[set after connect]"
  x:
    composio_connection_id: "[set after connect]"
    handle: "@valdesagency"
    analytics_mode: "blind"   # X API limits — accept blind for v1
  # tiktok: deferred to v1.1

# ============================================================
# CONTENT SOURCES
# ============================================================

sources:
  evergreen_dir: "memory/content/evergreen/valdes/"
  lead_scrapes: "memory/leads/"
  exa_queries:
    - "pool service marketing 2026"
    - "local SEO updates"
    - "Google Ads changes service businesses"
    - "home service business growth"
    - "service business website conversion"
  kg_filter:
    - "abstracted marketing lesson"
    - "industry observation"
    - "voice-tested content pattern"
  kg_blocked_patterns:
    - "\\$0 MRR"
    - "made \\d+ dials"
    - "just started"
    - "BrendanValdes-Context-.*"
    - "Phase 1 goal: first paying"

# ============================================================
# CONTENT-TYPE GUARDRAILS
# ============================================================

grind_aesthetic:
  max_per_week: 2
  must_be_generic: true   # no real numbers, no real situation references

face_content:
  pct_of_visuals: 0.15
  ai_generation: never
  photo_dir: "memory/brand/valdes/photos/"
  video_dir: "memory/brand/valdes/videos/"

# ============================================================
# PERFORMANCE
# ============================================================

performance:
  collection_delay_hours: 24
  weekly_analysis_time: "0 6 * * 0 America/Los_Angeles"   # Sun 6am Vegas time
  metrics_per_post:
    - "impressions"
    - "likes"
    - "comments"
    - "shares"
    - "saves"
    - "click_through"
    - "follow_conversions"

# ============================================================
# FEATURE FLAGS
# ============================================================
# Added Gate 3.1 (2026-05-22). Both default false. Flip to true when both unlock
# criteria are met (see memory/voice/valdes-tone-samples.md Manual Review Notes).

feature_flags:
  # Scenario 3 (named-client social proof) unlock:
  # Gate A: at least 1 ClientOutcome KG entity with all 8 required fields populated
  #         AND verifiable: true AND shareable: true.
  # Gate B: this flag = true.
  scenario_3_client_proof_unlocked: false

  # Scenario 8 "we fixed this" framing unlock:
  # Same two-gate logic as Scenario 3.
  # Alternate pattern (annotated public-site teardown) is active in v1 without unlock.
  scenario_8_we_fixed_this_unlocked: false
